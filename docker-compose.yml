services:
  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector Database ────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────
  backend:
    build: ./rag-multi-field-retrieval/backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./rag-multi-field-retrieval/backend/.env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./rag-multi-field-retrieval/backend/app:/app/app
      - ./rag-multi-field-retrieval/backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ── React Frontend ───────────────────────────────────────
  frontend:
    build: ./rag-multi-field-retrieval/frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./rag-multi-field-retrieval/frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_storage:
